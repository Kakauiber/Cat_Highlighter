<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>高亮与笔记管理</title>
  <link rel="stylesheet" href="options.css" />
</head>

<body>
  <div id="options-container">
    <header>
      <h1>高亮与笔记管理</h1>
      <input id="search-input" type="text" placeholder="搜索页面、笔记或高亮内容..." />
      <div class="actions">
        <button id="select-mode-btn" class="select-mode-btn">✅ 多选</button>
        <select id="export-dropdown" class="export-dropdown">
          <option value="">📥 导出全部</option>
          <option value="markdown">📄 Markdown 格式</option>
          <option value="html">🌐 HTML 格式</option>
        </select>
      </div>
    </header>
    <div id="view-filters" class="view-filters" aria-label="页面筛选">
      <button class="filter-chip active" data-filter="all">全部页面</button>
      <button class="filter-chip" data-filter="with-notes">有笔记</button>
      <button class="filter-chip" data-filter="notes-only">仅笔记</button>
      <button class="filter-chip" data-filter="highlights-only">仅高亮</button>
    </div>
    <details id="mowen-panel" class="mowen-panel" aria-label="墨问导出设置">
      <summary class="mowen-summary">
        <div class="mowen-summary-main">
          <div class="mowen-summary-title">生成墨问笔记</div>
          <div id="mowen-summary-meta" class="mowen-summary-meta">未配置 API Key</div>
        </div>
        <div class="mowen-summary-actions">
          <button id="mowen-quick-export-btn" class="mowen-quick-export-btn" type="button">导出全部到墨问</button>
          <span class="mowen-summary-chevron" aria-hidden="true"></span>
        </div>
      </summary>
      <div class="mowen-panel-body">
        <div class="mowen-panel-head">
          <div>
            <h2>墨问导出设置</h2>
            <p>使用 API 创建私密笔记。首次先完成测试，之后可直接在折叠栏导出全部。</p>
          </div>
        </div>
        <div class="mowen-form">
          <label class="mowen-field">
            <span>API Key</span>
            <input id="mowen-api-key" type="password" placeholder="输入墨问 API Key" autocomplete="off" />
          </label>
          <label class="mowen-field">
            <span>默认标签</span>
            <input id="mowen-tags" type="text" placeholder="划线猫, 私密笔记" />
          </label>
        </div>
        <div class="mowen-actions">
          <button id="mowen-save-btn" type="button">保存设置</button>
          <button id="mowen-test-btn" type="button">测试导出</button>
          <button id="mowen-export-btn" type="button">导出全部到墨问</button>
        </div>
        <div id="mowen-status" class="mowen-status" aria-live="polite"></div>
      </div>
    </details>
    <!-- Batch selection header (hidden by default) -->
    <div id="batch-header" class="batch-header hidden">
      <label class="select-all-label">
        <input type="checkbox" id="select-all-checkbox" />
        <span id="select-count">已选 0 条（勾选前框可全选）</span>
      </label>
      <button id="cancel-select-btn" class="cancel-btn">取消</button>
    </div>
    <div id="pages-list"></div>
    <div id="blacklist-section" style="margin-top: 40px; border-top: 2px solid #eee; padding-top: 20px;">
      <h2>黑名单管理</h2>
      <p style="color:#666;font-size:14px;margin-bottom:10px;">以下网站已被禁用划线功能：</p>
      <div id="blacklist-container"></div>
    </div>
  </div>
  <!-- Batch action bar (hidden by default) -->
  <div id="batch-action-bar" class="batch-action-bar hidden">
    <button id="batch-delete-btn" class="batch-btn danger">🗑️ 删除所选</button>
    <button id="batch-copy-btn" class="batch-btn primary">📋 合并复制</button>
  </div>
  <script src="note-repo.js"></script>
  <script src="page-note-service.js"></script>
  <script src="feature-gate.js"></script>
  <script src="export-service.js"></script>
  <script src="mowen-exporter.js"></script>
  <script src="options.js"></script>
</body>

</html>
